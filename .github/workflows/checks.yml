# The quality net (research report, wk 2): typecheck + rules tests on every
# push and PR, and the phone flows on both engines. Fails loudly, so a
# regression is caught before the table is.

name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Typecheck, lint, rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test

  phone-flows:
    name: Phone flows (iPhone WebKit + Pixel Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
