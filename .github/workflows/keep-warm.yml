# Supabase pauses Free-plan projects after ~7 days of low activity, which
# would silently kill a campaign played weeks apart (research report, Area 5).
# This pings the database twice a week (Mon/Thu) so the project never sleeps.
# 2026-08-15: repointed to project lgyhivvfuvoyatqzhath — the old target had
# been deleted, and the live project paused while this ran green against a ghost. The anon key is
# public by design; the RPC returns null for an unknown code and costs nothing.
# Retire this workflow if the project ever moves to Supabase Pro.

name: Keep Supabase warm

on:
  schedule:
    - cron: '23 7 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database via RPC
        run: |
          ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxneWhpdnZmdXZveWF0cXpoYXRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNzE5NTMsImV4cCI6MjA5OTg0Nzk1M30.ILDoQUHbZLB0zVIzGnHcQbZOu9D-MqHDYU6hTU6Dy1E"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://lgyhivvfuvoyatqzhath.supabase.co/rest/v1/rpc/get_channel" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
            -H "Content-Type: application/json" \
            -d '{"p_code":"KEEPWARM"}')
          echo "Supabase responded $code"
          test "$code" = "200"
